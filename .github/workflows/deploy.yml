name: Deploy

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read
  id-token: write
  actions: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  desplegar:
    name: Construir y desplegar ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: La etiqueta debe apuntar a un commit de main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::La etiqueta no apunta a un commit de main."; exit 1; }

      - name: El CI debe haber pasado en ese commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ok=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status success --json conclusion --jq length)
          [ "$ok" -ge 1 ] || { echo "::error::El CI no esta en verde para este commit."; exit 1; }

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Recrear deploy/config.env
        env:
          PROJECT_ID: ${{ vars.PROJECT_ID }}
          REGION: ${{ vars.REGION }}
          SERVICE_NAME: ${{ vars.SERVICE_NAME }}
          AR_REPO: ${{ vars.AR_REPO }}
          RUNTIME_SA: ${{ vars.RUNTIME_SA }}
          DEPLOY_SA: ${{ vars.DEPLOY_SA }}
          PUBLIC_HOST: ${{ vars.PUBLIC_HOST }}
        run: |
          {
            echo "PROJECT_ID=$PROJECT_ID"
            echo "REGION=$REGION"
            echo "SERVICE_NAME=$SERVICE_NAME"
            echo "AR_REPO=$AR_REPO"
            echo "RUNTIME_SA=$RUNTIME_SA"
            echo "DEPLOY_SA=$DEPLOY_SA"
            echo "PUBLIC_HOST=$PUBLIC_HOST"
          } > deploy/config.env

      - name: Construir y publicar las tres imagenes
        run: bash deploy/build-push.sh "$GITHUB_REF_NAME"

      - name: Desplegar
        run: bash deploy/deploy.sh "$GITHUB_REF_NAME"

      - name: Comprobar /ready
        env:
          PUBLIC_HOST: ${{ vars.PUBLIC_HOST }}
        run: |
          url="https://${PUBLIC_HOST%%,*}/ready"
          for i in 1 2 3 4 5 6; do
            r=$(curl -fsS "$url" || true)
            echo "$r"
            if echo "$r" | grep -qF "\"version\":\"$GITHUB_REF_NAME\""; then exit 0; fi
            sleep 10
          done
          echo "::error::/ready no devolvio la version $GITHUB_REF_NAME"
          exit 1